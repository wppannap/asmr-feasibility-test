<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASMR · sleep — scrolly map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#scrolly-1">Skip to content</a>

  <header class="hero" id="top">
    <p class="hero-brand">ASMR · sleep</p>
    <h1 class="hero-title">TODO: my text</h1>
    <p class="hero-dek">TODO: my text</p>
  </header>

  <nav class="site-nav" id="site-nav" aria-label="Section navigation">
    <a href="#top">Top</a>
    <a href="#scrolly-1">Map 1</a>
    <a href="#scrolly-2">Map 2</a>
    <a href="#scrolly-4">Scatter</a>
    <a href="#scrolly-6">Wiki</a>
  </nav>

  <!-- Stage 1: dual-layer choropleth -->
  <section class="scrolly" id="scrolly-1" data-stage="1">
    <figure class="stage" id="stage-1">
      <div class="map-panels" id="map-panels-1">
        <div class="map-panel" data-panel="trends">
          <p class="map-panel-title" id="trends-panel-title">ASMR search growth (latest 12 months ÷ first 12 months − 1)</p>
          <p class="map-panel-subtitle" id="trends-window-subtitle">Window: Nov 2021 to Oct 2026</p>
          <div class="map-svg-wrap" id="map-trends"></div>
          <div class="legend" id="legend-trends"></div>
          <p class="map-caption" id="trends-map-caption" aria-live="polite"></p>
          <div class="table-host" id="trends-table-host"></div>
        </div>
      </div>

      <p class="caveat" id="caveat-1">Loading…</p>
      <div class="tooltip" id="tooltip" hidden></div>
    </figure>

    <article class="steps">
      <div class="step" data-step="1-1"><p>TODO: my text</p></div>
      <div class="step" data-step="1-2"><p>TODO: my text</p></div>
      <div class="step" data-step="1-3"><p>TODO: my text</p></div>
      <div class="step" data-step="1-4"><p>TODO: my text</p></div>
    </article>
  </section>

  <!-- Stage 2: monthly time-lapse -->
  <section class="scrolly" id="scrolly-2" data-stage="2">
    <figure class="stage" id="stage-2">
      <div class="stage-chrome">
        <div class="control-row timeline-row">
          <button type="button" class="play-btn" id="play-btn" aria-label="Play" aria-pressed="false">Play</button>
          <input type="range" id="month-scrubber" min="0" max="1" value="0" step="1" aria-label="Month scrubber" aria-readonly="false" />
          <span class="month-label" id="month-label" aria-live="polite">—</span>
        </div>
        <p class="month-caption" id="month-caption">each region relative to its own peak</p>
      </div>

      <div class="map-panels single">
        <div class="map-panel">
          <p class="map-panel-title">ASMR own-peak time-lapse</p>
          <p class="map-panel-subtitle" id="monthly-window-subtitle">Window: Nov 2021 to Oct 2026</p>
          <div class="map-svg-wrap" id="map-monthly"></div>
          <div class="legend" id="legend-monthly"></div>
          <div class="table-host" id="monthly-table-host"></div>
        </div>
      </div>

      <p class="caveat" id="caveat-2">Loading…</p>
    </figure>

    <article class="steps">
      <div class="step" data-step="2-1"><p>TODO: my text</p></div>
      <div class="step" data-step="2-2"><p>TODO: my text</p></div>
      <div class="step" data-step="2-3"><p>TODO: my text</p></div>
    </article>
  </section>


  <!-- Stage 4: insomnia scatter -->
  <section class="scrolly" id="scrolly-4" data-chart="scatter">
    <figure class="stage stage-chart">
      <div class="chart-root" id="chart-scatter"></div>
      <p class="caveat" id="caveat-4">Loading…</p>
    </figure>
    <article class="steps">
      <div class="step" data-step="4-1"><p>TODO: my text</p></div>
      <div class="step" data-step="4-2"><p>TODO: my text</p></div>
      <div class="step" data-step="4-3"><p>TODO: my text</p></div>
    </article>
  </section>


  <!-- Stage 6: wiki small multiples -->
  <section class="scrolly" id="scrolly-6" data-chart="wiki">
    <figure class="stage stage-chart stage-tall">
      <div class="chart-root chart-scroll" id="chart-wiki"></div>
      <p class="caveat" id="caveat-6">Loading…</p>
    </figure>
    <article class="steps">
      <div class="step" data-step="6-1"><p>TODO: my text</p></div>
      <div class="step" data-step="6-2"><p>TODO: my text</p></div>
      <div class="step" data-step="6-3"><p>TODO: my text</p></div>
    </article>
  </section>

  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://unpkg.com/scrollama@3.2.0/build/scrollama.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/iso.js"></script>

</body>
