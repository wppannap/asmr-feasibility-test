# Editable video class keyword lists for human-performed/recorded ASMR scope.
# Matching uses the same haystack as expand_by_channel.py::classify:
#   title + tags + description_short + topicCategories (lowercased).
# Latin sleep_strict terms use word-boundary regex; other lists are substrings.

removed_from_old_asmr_core:
  - "耳あgraphs"      # corrupted / non-term
  - "耳messenger"     # repeated thrice in old list; not a real ASMR term
  - "오디오는"         # Korean fragment "audio is", not an ASMR label
  - "이마 귀"          # "forehead ear" fragment; not a stable ASMR label

